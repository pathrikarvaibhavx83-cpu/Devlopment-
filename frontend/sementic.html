<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic HTML</title>
</head>

<body>

  <!-- Website Header -->
  <header>
    <h1>My Learning Website</h1>
    <p>Welcome to my website</p>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Main Content -->
  <main>

    <!-- Section -->
    <section>
      <h2>About HTML</h2>
      <p>HTML is used to structure web pages.</p>
    </section>

    <!-- Article -->
    <article>
      <h2>My Learning Journey</h2>
      <p>I am learning frontend development.</p>
    </article>

    <!-- Aside -->
    <aside>
      <h3>Related Topics</h3>
      <p>CSS and JavaScript</p>
    </aside>

  </main>

  <!-- Footer -->
  <footer>
    <p>Copyright 2026 My Website</p>
  </footer>

</body>

</html>
