<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>HTML Links</title>
</head>

<body>

  <h1>Learning HTML Links</h1>

  <!-- Basic link -->
  <a href="https://www.google.com">
    Visit Google
  </a>

  <br><br>

  <!-- Open link in new tab -->
  <a href="https://www.youtube.com" target="_blank">
    Visit YouTube
  </a>

  <br><br>

  <!-- Email link -->
  <a href="mailto:example@gmail.com">
    Send Email
  </a>

  <br><br>

  <!-- Phone link -->
  <a href="tel:+911234567890">
    Call Us
  </a>

</body>

</html>
