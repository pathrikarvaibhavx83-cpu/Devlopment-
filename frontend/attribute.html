<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>HTML Attributes</title>
</head>

<body>

  <h1>Learning HTML Attributes</h1>

  <!-- ID attribute -->
  <h2 id="heading">This is an ID example</h2>

  <!-- Class attribute -->
  <p class="info">This is a class example.</p>

  <!-- Style attribute -->
  <p style="color: blue;">
    This text is blue.
  </p>

  <!-- Title attribute -->
  <p title="This is additional information">
    Hover over this text.
  </p>

  <!-- Hidden attribute -->
  <p hidden>
    This paragraph is hidden.
  </p>

  <!-- Required attribute -->
  <input type="text" required placeholder="Enter your name">

  <br><br>

  <!-- Disabled attribute -->
  <button disabled>Disabled Button</button>

  <br><br>

  <!-- Readonly attribute -->
  <input type="text" value="HTML Practice" readonly>

</body>

</html>
