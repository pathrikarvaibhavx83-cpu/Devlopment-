<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Iframe</title>
</head>

<body>

  <h1>Learning HTML Iframes</h1>

  <!-- Basic iframe -->
  <h2>Example 1: Website</h2>

  <iframe src="https://example.com" width="500" height="300" title="Example Website">
  </iframe>

  <br><br>

  <!-- YouTube video -->
  <h2>Example 2: YouTube Video</h2>

  <iframe width="500" height="300" src="https://www.youtube.com/embed/VIDEO_ID" title="YouTube Video" allowfullscreen>
  </iframe>

</body>

</html>
