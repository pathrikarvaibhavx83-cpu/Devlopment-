<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>HTML Images</title>
</head>

<body>

  <h1>Learning HTML Images</h1>

  <!-- Basic image -->
  <img src="https://placehold.co/300x200" alt="Sample image">

  <br><br>

  <!-- Image with width and height -->
  <img src="https://placehold.co/200x150" alt="Nature image" width="200" height="150">

  <br><br>

  <!-- Clickable image -->
  <a href="https://www.google.com">
    <img src="https://placehold.co/150x100" alt="Click to visit Google">
  </a>

</body>

</html>
